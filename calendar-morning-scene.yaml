blueprint:
  name: Calendar Morning Action
  description: >
    At a set time each morning, read today's events from a calendar and set a
    device, entity or helper if any of today's event names matches one from your list.

    Add as many event names as you like — the automation acts once if at least
    one of today's events matches any of them.

    Matching is exact but case-insensitive (leading/trailing spaces ignored).

    The target can be any entities, devices or areas. Leave "Value" at "on" (or
    set it to "off") to simply switch the target — scene, script, light, switch,
    input_boolean, a whole device or a whole area. Any other value is applied
    per entity: an option for input_select/select, a number for
    input_number/number, text for input_text/text.

    Uses calendar.get_events so it sees ALL of today's events (all-day and timed),
    not just whatever event happens to be active at the trigger time.
  domain: automation
  author: Janis
  input:
    calendar:
      name: Calendar
      description: The calendar to read today's events from.
      selector:
        entity:
          filter:
            domain: calendar

    run_time:
      name: Run time
      description: Time each morning to check the calendar.
      default: "07:00:00"
      selector:
        time: {}

    event_names:
      name: Event names
      description: >
        Event names to look for. Add as many as you need — one per row.
        Case and surrounding spaces are ignored.
      default: []
      selector:
        text:
          multiple: true

    target:
      name: Target
      description: >
        What to set when today has a matching event — pick any entities,
        devices or areas. Helpers (input_select, input_number, input_text, …)
        can be given a value below.
      selector:
        target: {}

    target_value:
      name: Value
      description: >
        What to set the entity to. "on" turns it on, "off" turns it off; any
        other text is used as the option/number/text value for helper entities.
      default: "on"
      selector:
        text: {}

mode: single
max_exceeded: silent

variables:
  cal_entity: !input calendar
  raw_names: !input event_names
  # Accept both a list and a single string, then normalise for comparison.
  wanted: >
    {{ (raw_names if raw_names is iterable and raw_names is not string
        else [raw_names])
       | map('lower') | map('trim') | reject('equalto', '') | list }}
  raw_target: !input target
  value: !input target_value
  value_trimmed: "{{ value | string | trim }}"
  value_norm: "{{ value_trimmed | lower }}"
  # Flatten the target (entities + devices + areas) down to plain entity ids,
  # so a value can be set on each one individually.
  target_entities: >
    {% set t = raw_target if raw_target is mapping else {} %}
    {% set ents = t.get('entity_id', []) %}
    {% set ents = [ents] if ents is string else ents %}
    {% set devs = t.get('device_id', []) %}
    {% set devs = [devs] if devs is string else devs %}
    {% set areas = t.get('area_id', []) %}
    {% set areas = [areas] if areas is string else areas %}
    {{ (ents
        + (devs | map('device_entities') | sum(start=[]) | list)
        + (areas | map('area_entities') | sum(start=[]) | list))
       | unique | list }}

triggers:
  - trigger: time
    at: !input run_time

conditions: []

actions:
  # Pull all of today's events (00:00 -> 24:00 local).
  - action: calendar.get_events
    target:
      entity_id: !input calendar
    data:
      start_date_time: "{{ today_at('00:00') }}"
      end_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
    response_variable: cal

  # Normalise today's event names to lower-case, trimmed strings.
  - variables:
      summaries: >
        {{ (cal[cal_entity].events if cal_entity in cal else [])
           | map(attribute='summary') | map('lower') | map('trim') | list }}

  # Stop unless one of today's events matches a configured name.
  - condition: template
    value_template: "{{ wanted | select('in', summaries) | list | count > 0 }}"

  # Set the target: plain on/off hits devices and areas directly; any other
  # value is applied per entity with the service that fits its domain.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ value_norm in ['', 'on', 'true', '1'] }}"
        sequence:
          - action: homeassistant.turn_on
            target: !input target

      - conditions:
          - condition: template
            value_template: "{{ value_norm in ['off', 'false', '0'] }}"
        sequence:
          - action: homeassistant.turn_off
            target: !input target

    default:
      - repeat:
          for_each: "{{ target_entities }}"
          sequence:
            - variables:
                entity_domain: "{{ repeat.item | split('.') | first }}"
            - choose:
                # Selects: input_select.select_option / select.select_option
                - conditions:
                    - condition: template
                      value_template: >
                        {{ entity_domain in ['input_select', 'select'] }}
                  sequence:
                    - action: "{{ entity_domain }}.select_option"
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        option: "{{ value_trimmed }}"

                # Numbers and text helpers: <domain>.set_value
                - conditions:
                    - condition: template
                      value_template: >
                        {{ entity_domain in ['input_number', 'number',
                                             'input_text', 'text'] }}
                  sequence:
                    - action: "{{ entity_domain }}.set_value"
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        value: "{{ value_trimmed }}"

              # Domain takes no value — just turn it on.
              default:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
