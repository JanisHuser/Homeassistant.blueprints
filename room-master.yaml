blueprint:
  name: Room Master
  description: >
    A virtual "room" switch (an input_boolean) that is the single source of truth
    for a room, exposed to Apple Home / HomeKit while the real devices stay hidden.

    Behavior:
      - Master ON from Home Assistant / HomeKit:
          Bright scene during the bright window
          Dim scene outside the bright window
      - Master OFF:
          Off scene

      - Normal physical source:
          Master OFF -> turn master ON and apply time-based Bright/Dim
          Master ON  -> turn master OFF and apply Off

      - Force-Bright physical source:
          Master OFF -> turn master ON and apply Bright
          Master ON  -> turn master OFF and apply Off

      - Force-Dim physical source:
          Master OFF -> turn master ON and apply Dim
          Master ON  -> turn master OFF and apply Off

    Source precedence:
      Force-Bright > Force-Dim > Normal

    No mode helper is required.

  domain: automation
  author: Janis

  input:

    master:
      name: Room master
      description: >
        The input_boolean that represents this room.
        Expose THIS entity to Apple Home / HomeKit.
      selector:
        entity:
          filter:
            domain: input_boolean

    sources:
      name: Physical input devices
      description: >
        Normal physical inputs such as switches, buttons and motion sensors.
        When the master is turned ON by one of these sources, Bright or Dim
        is selected according to the time-of-day window.
      selector:
        entity:
          multiple: true

    bright_sources:
      name: Physical inputs — force Bright
      description: >
        Physical inputs that always turn the room ON with the Bright scene.
        When the room is already ON, the next press turns it OFF.
        Force-Bright has priority over Force-Dim and Normal.
      default: []
      selector:
        entity:
          multiple: true

    dim_sources:
      name: Physical inputs — force Dim
      description: >
        Physical inputs that always turn the room ON with the Dim scene.
        When the room is already ON, the next press turns it OFF.
        Force-Dim has priority over Normal, but loses to Force-Bright.
      default: []
      selector:
        entity:
          multiple: true

    map_mode:
      name: How normal inputs map to the master
      description: >
        Toggle:
          Every physical on/off change toggles the master.
          Recommended for wall switches and momentary buttons.

        Follow:
          Any normal source turning ON turns the master ON.
          The master turns OFF only when all normal sources are OFF.
      default: toggle
      selector:
        select:
          options:
            - label: "Toggle (every physical change flips master) — recommended"
              value: toggle
            - label: "Follow (any on / all off)"
              value: follow

    scene_off:
      name: "Off scene"
      selector:
        entity:
          filter:
            domain: scene

    scene_bright:
      name: "Bright scene"
      selector:
        entity:
          filter:
            domain: scene

    scene_dim:
      name: "Dim scene"
      selector:
        entity:
          filter:
            domain: scene

    sun_entity:
      name: Sun entity
      description: >
        Provides sunrise and sunset times for the Bright window.
      default: sun.sun
      selector:
        entity:
          filter:
            domain: sun

    bright_before_sunrise:
      name: Bright starts before sunrise
      description: >
        Hours to shift the start of Bright relative to sunrise.
        Positive = Bright starts before sunrise.
        Negative = Bright starts after sunrise.
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider

    bright_after_sunset:
      name: Bright ends after sunset
      description: >
        Hours to shift the end of Bright relative to sunset.
        Positive = Bright continues after sunset.
        Negative = Bright ends before sunset.
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider


mode: queued
max: 10
max_exceeded: silent


variables:
  master: !input master
  sources: !input sources
  bright_sources: !input bright_sources
  dim_sources: !input dim_sources
  map_mode: !input map_mode
  sun_entity: !input sun_entity
  bright_before_sunrise: !input bright_before_sunrise
  bright_after_sunset: !input bright_after_sunset


triggers:

  # ============================================================
  # NORMAL SOURCES
  # ============================================================
  - trigger: state
    entity_id: !input sources
    id: source

  # ============================================================
  # FORCE-BRIGHT SOURCES
  # ============================================================
  - trigger: state
    entity_id: !input bright_sources
    id: bright_source

  # ============================================================
  # FORCE-DIM SOURCES
  # ============================================================
  - trigger: state
    entity_id: !input dim_sources
    id: dim_source

  # ============================================================
  # MASTER
  #
  # This is used for changes made from Home Assistant / HomeKit.
  # Changes caused by this automation itself are ignored.
  # ============================================================
  - trigger: state
    entity_id: !input master
    id: master


conditions: []


actions:

  # ============================================================
  # FORCE-BRIGHT SOURCE
  # ============================================================
  - choose:

      - conditions:

          - condition: template
            value_template: "{{ trigger.id == 'bright_source' }}"

          - condition: template
            value_template: >
              {{ trigger.to_state.state not in ['unknown', 'unavailable'] }}

          # Button/event entities fire on any state change.
          # Normal entities require a real on/off transition.
          - condition: template
            value_template: >
              {{
                trigger.entity_id.split('.')[0] in ['button', 'event']
                or (
                  trigger.to_state.state in ['on', 'off']
                  and trigger.from_state.state in ['on', 'off']
                  and trigger.from_state.state != trigger.to_state.state
                )
              }}

        sequence:

          # ------------------------------------------------------
          # Master currently ON
          #
          # Physical Force-Bright source turns the room OFF.
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - condition: state
                    entity_id: !input master
                    state: "on"

                sequence:

                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off

            # ----------------------------------------------------
            # Master currently OFF
            #
            # Physical Force-Bright source turns the room ON
            # and ALWAYS uses Bright.
            # ----------------------------------------------------
            default:

              - action: input_boolean.turn_on
                target:
                  entity_id: !input master

              - action: scene.turn_on
                target:
                  entity_id: !input scene_bright


  # ============================================================
  # FORCE-DIM SOURCE
  # ============================================================
  - choose:

      - conditions:

          - condition: template
            value_template: "{{ trigger.id == 'dim_source' }}"

          # Force-Bright wins if the same entity is configured twice.
          - condition: template
            value_template: "{{ trigger.entity_id not in bright_sources }}"

          - condition: template
            value_template: >
              {{ trigger.to_state.state not in ['unknown', 'unavailable'] }}

          - condition: template
            value_template: >
              {{
                trigger.entity_id.split('.')[0] in ['button', 'event']
                or (
                  trigger.to_state.state in ['on', 'off']
                  and trigger.from_state.state in ['on', 'off']
                  and trigger.from_state.state != trigger.to_state.state
                )
              }}

        sequence:

          # ------------------------------------------------------
          # Master currently ON -> OFF
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - condition: state
                    entity_id: !input master
                    state: "on"

                sequence:

                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off

            # ----------------------------------------------------
            # Master currently OFF -> ON + Dim
            # ----------------------------------------------------
            default:

              - action: input_boolean.turn_on
                target:
                  entity_id: !input master

              - action: scene.turn_on
                target:
                  entity_id: !input scene_dim


  # ============================================================
  # NORMAL SOURCE
  # ============================================================
  - choose:

      - conditions:

          - condition: template
            value_template: "{{ trigger.id == 'source' }}"

          # Force-Bright wins.
          - condition: template
            value_template: "{{ trigger.entity_id not in bright_sources }}"

          # Force-Dim wins over Normal.
          - condition: template
            value_template: "{{ trigger.entity_id not in dim_sources }}"

        sequence:

          - choose:

              # ==================================================
              # TOGGLE — BUTTON / EVENT
              # ==================================================
              - conditions:

                  - condition: template
                    value_template: "{{ map_mode == 'toggle' }}"

                  - condition: template
                    value_template: >
                      {{ trigger.entity_id.split('.')[0] in ['button', 'event'] }}

                  - condition: template
                    value_template: >
                      {{ trigger.to_state.state not in ['unknown', 'unavailable'] }}

                sequence:

                  - choose:

                      # ------------------------------------------
                      # Master ON -> OFF
                      # ------------------------------------------
                      - conditions:
                          - condition: state
                            entity_id: !input master
                            state: "on"

                        sequence:

                          - action: input_boolean.turn_off
                            target:
                              entity_id: !input master

                          - action: scene.turn_on
                            target:
                              entity_id: !input scene_off

                    # --------------------------------------------
                    # Master OFF -> ON + time-based scene
                    # --------------------------------------------
                    default:

                      - action: input_boolean.turn_on
                        target:
                          entity_id: !input master

                      - choose:

                          # Bright window
                          - conditions:
                              - condition: template
                                value_template: >
                                  {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                                  {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                                  {% set n = as_timestamp(now()) %}
                                  {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                                  {% set post = (bright_after_sunset | float(0)) * 3600 %}
                                  {% set day = is_state(sun_entity, 'above_horizon') %}

                                  {{
                                    (
                                      day
                                      and (
                                        r is none
                                        or ((r - 86400) - n) <= pre
                                      )
                                      and (
                                        s is none
                                        or (n - s) <= post
                                      )
                                    )
                                    or
                                    (
                                      not day
                                      and r is not none
                                      and (r - n) <= pre
                                    )
                                    or
                                    (
                                      not day
                                      and s is not none
                                      and (n - (s - 86400)) <= post
                                    )
                                  }}

                            sequence:

                              - action: scene.turn_on
                                target:
                                  entity_id: !input scene_bright

                        # Dark
                        default:

                          - action: scene.turn_on
                            target:
                              entity_id: !input scene_dim


              # ==================================================
              # TOGGLE — NORMAL ON/OFF ENTITY
              # ==================================================
              - conditions:

                  - condition: template
                    value_template: "{{ map_mode == 'toggle' }}"

                  - condition: template
                    value_template: >
                      {{
                        trigger.to_state.state in ['on', 'off']
                        and trigger.from_state.state in ['on', 'off']
                        and trigger.from_state.state != trigger.to_state.state
                      }}

                sequence:

                  - choose:

                      # ------------------------------------------
                      # Master ON -> OFF
                      # ------------------------------------------
                      - conditions:
                          - condition: state
                            entity_id: !input master
                            state: "on"

                        sequence:

                          - action: input_boolean.turn_off
                            target:
                              entity_id: !input master

                          - action: scene.turn_on
                            target:
                              entity_id: !input scene_off

                    # --------------------------------------------
                    # Master OFF -> ON + time-based scene
                    # --------------------------------------------
                    default:

                      - action: input_boolean.turn_on
                        target:
                          entity_id: !input master

                      - choose:

                          - conditions:
                              - condition: template
                                value_template: >
                                  {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                                  {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                                  {% set n = as_timestamp(now()) %}
                                  {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                                  {% set post = (bright_after_sunset | float(0)) * 3600 %}
                                  {% set day = is_state(sun_entity, 'above_horizon') %}

                                  {{
                                    (
                                      day
                                      and (
                                        r is none
                                        or ((r - 86400) - n) <= pre
                                      )
                                      and (
                                        s is none
                                        or (n - s) <= post
                                      )
                                    )
                                    or
                                    (
                                      not day
                                      and r is not none
                                      and (r - n) <= pre
                                    )
                                    or
                                    (
                                      not day
                                      and s is not none
                                      and (n - (s - 86400)) <= post
                                    )
                                  }}

                            sequence:

                              - action: scene.turn_on
                                target:
                                  entity_id: !input scene_bright

                        default:

                          - action: scene.turn_on
                            target:
                              entity_id: !input scene_dim


              # ==================================================
              # FOLLOW — SOURCE TURNED ON
              # ==================================================
              - conditions:

                  - condition: template
                    value_template: "{{ map_mode == 'follow' }}"

                  - condition: template
                    value_template: >
                      {{ trigger.to_state.state == 'on' }}

                sequence:

                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input master

                  - choose:

                      - conditions:
                          - condition: template
                            value_template: >
                              {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                              {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                              {% set n = as_timestamp(now()) %}
                              {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                              {% set post = (bright_after_sunset | float(0)) * 3600 %}
                              {% set day = is_state(sun_entity, 'above_horizon') %}

                              {{
                                (
                                  day
                                  and (
                                    r is none
                                    or ((r - 86400) - n) <= pre
                                  )
                                  and (
                                    s is none
                                    or (n - s) <= post
                                  )
                                )
                                or
                                (
                                  not day
                                  and r is not none
                                  and (r - n) <= pre
                                )
                                or
                                (
                                  not day
                                  and s is not none
                                  and (n - (s - 86400)) <= post
                                )
                              }}

                        sequence:

                          - action: scene.turn_on
                            target:
                              entity_id: !input scene_bright

                    default:

                      - action: scene.turn_on
                        target:
                          entity_id: !input scene_dim


              # ==================================================
              # FOLLOW — ALL SOURCES OFF
              # ==================================================
              - conditions:

                  - condition: template
                    value_template: "{{ map_mode == 'follow' }}"

                  - condition: template
                    value_template: >
                      {{
                        expand(sources)
                        | selectattr('state', 'eq', 'on')
                        | list
                        | count == 0
                      }}

                sequence:

                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off


  # ============================================================
  # MASTER CHANGED
  #
  # This handles Home Assistant / HomeKit changes.
  #
  # If the master change was caused by THIS automation, the
  # physical-source branch has already applied the correct scene,
  # so we do nothing here.
  # ============================================================
  - choose:

      - conditions:

          - condition: template
            value_template: "{{ trigger.id == 'master' }}"

          # Ignore master changes caused by another action inside
          # this automation.
          - condition: template
            value_template: >
              {{ trigger.to_state.context.parent_id is none }}

        sequence:

          # ------------------------------------------------------
          # Master OFF
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - condition: state
                    entity_id: !input master
                    state: "off"

                sequence:

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off

            # ----------------------------------------------------
            # Master ON
            # ----------------------------------------------------
            default:

              - choose:

                  # ==================================================
                  # BRIGHT WINDOW
                  # ==================================================
                  - conditions:
                      - condition: template
                        value_template: >
                          {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                          {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                          {% set n = as_timestamp(now()) %}
                          {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                          {% set post = (bright_after_sunset | float(0)) * 3600 %}
                          {% set day = is_state(sun_entity, 'above_horizon') %}

                          {{
                            (
                              day
                              and (
                                r is none
                                or ((r - 86400) - n) <= pre
                              )
                              and (
                                s is none
                                or (n - s) <= post
                              )
                            )
                            or
                            (
                              not day
                              and r is not none
                              and (r - n) <= pre
                            )
                            or
                            (
                              not day
                              and s is not none
                              and (n - (s - 86400)) <= post
                            )
                          }}

                    sequence:

                      - action: scene.turn_on
                        target:
                          entity_id: !input scene_bright

                # ==================================================
                # DARK
                # ==================================================
                default:

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_dim