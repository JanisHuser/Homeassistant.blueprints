blueprint:
  name: Room Master
  description: >
    A virtual "room" switch (an input_boolean) that is the single source of truth
    for a room, exposed to Apple Home / HomeKit while the real devices stay hidden.

    Two directions, one automation:
      - Physical devices (switches, buttons, motion) write INTO the master.
      - When the master changes, the matching scene is applied:
            master OFF            -> "Off" scene
            master ON + daylight  -> "Bright" scene
            master ON + dark      -> "Dim" scene

    Everything below is configured from the UI — pick your entities and scenes
    from the dropdowns. Create one instance of this blueprint per room.
  domain: automation
  author: Janis
  input:
    master:
      name: Room master
      description: The input_boolean that represents this room (expose THIS to HomeKit).
      selector:
        entity:
          filter:
            domain: input_boolean

    sources:
      name: Physical input devices
      description: >
        Switches / buttons / motion sensors that drive the master.
        Do NOT list the lights the scenes control here, or you'll create a loop.
      selector:
        entity:
          multiple: true

    map_mode:
      name: How inputs map to the master
      description: >
        Follow — any source ON turns the master ON; when ALL sources are OFF the
        master turns OFF. Only use with sources HA can keep in sync (motion,
        smart bulbs). A dumb wall switch will desync after a virtual OFF.
        Toggle — every physical change (either direction) flips the master.
        Best for bistable wall switches, and the only mode that works for
        momentary buttons (button/event entities): a flip always works even
        after the master was turned off from Apple Home.
      default: toggle
      selector:
        select:
          options:
            - label: "Toggle (every physical change flips master) — recommended"
              value: toggle
            - label: "Follow (any on / all off)"
              value: follow

    scene_off:
      name: "Off scene"
      selector:
        entity:
          filter:
            domain: scene

    scene_bright:
      name: "Bright scene (daylight)"
      selector:
        entity:
          filter:
            domain: scene

    scene_dim:
      name: "Dim scene (dark)"
      selector:
        entity:
          filter:
            domain: scene

    sun_entity:
      name: Sun entity
      description: Provides sunrise/sunset times for the Bright window.
      default: sun.sun
      selector:
        entity:
          filter:
            domain: sun

    # The Bright window is time-based: daytime, extended by N hours before
    # sunrise and M hours after sunset. Outside that window it's Dim.
    bright_before_sunrise:
      name: Bright starts before sunrise
      description: >
        Hours to shift the start of "Bright" relative to sunrise. Positive =
        Bright begins before sunrise. Negative = Bright begins after sunrise
        (so Dim ends later, into the morning).
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider
    bright_after_sunset:
      name: Bright ends after sunset
      description: >
        Hours to shift the end of "Bright" relative to sunset. Positive =
        Bright still applies after sunset. Negative = Bright ends before sunset
        (so Dim starts earlier, before dusk).
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider

mode: queued
max: 10
max_exceeded: silent

variables:
  master: !input master
  sources: !input sources
  map_mode: !input map_mode
  sun_entity: !input sun_entity
  bright_before_sunrise: !input bright_before_sunrise
  bright_after_sunset: !input bright_after_sunset

triggers:
  - trigger: state
    entity_id: !input sources
    id: source
  - trigger: state
    entity_id: !input master
    id: master

conditions: []

actions:
  - choose:
      # --- Physical device changed: update the master -------------------
      - conditions:
          - "{{ trigger.id == 'source' }}"
        sequence:
          - choose:
              # toggle: momentary device (button / event entity) fired -> flip.
              # These are stateless: their "state" is the timestamp of the last
              # press, so every press is a fresh state change. Match on the
              # domain and flip on any valid press (ignore restart -> unknown).
              - conditions:
                  - "{{ map_mode == 'toggle' }}"
                  - "{{ trigger.entity_id.split('.')[0] in ['button', 'event'] }}"
                  - "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
                sequence:
                  - action: input_boolean.toggle
                    target:
                      entity_id: !input master

              # toggle: any real on/off change of a source -> flip master
              # (fires on both edges so a desynced bistable switch still works)
              - conditions:
                  - "{{ map_mode == 'toggle' }}"
                  - "{{ trigger.to_state.state in ['on', 'off'] }}"
                  - "{{ trigger.from_state.state in ['on', 'off'] }}"
                  - "{{ trigger.from_state.state != trigger.to_state.state }}"
                sequence:
                  - action: input_boolean.toggle
                    target:
                      entity_id: !input master

              # follow: source became active -> master on
              - conditions:
                  - "{{ map_mode == 'follow' }}"
                  - "{{ trigger.to_state.state == 'on' }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input master

              # follow: last active source went off -> master off
              - conditions:
                  - "{{ map_mode == 'follow' }}"
                  - "{{ expand(sources) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master
          # else: do nothing

      # --- Master changed: apply the matching scene ---------------------
      - conditions:
          - "{{ trigger.id == 'master' }}"
        sequence:
          - choose:
              # master OFF -> off scene
              - conditions:
                  - "{{ is_state(master, 'off') }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off

              # master ON + within the time-based bright window -> bright scene
              # Bright window = [sunrise - pre, sunset + post]. pre/post may be
              # negative, which shrinks the window into daylight (Dim ends later
              # in the morning / starts earlier before dusk).
              - conditions:
                  - >
                    {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                    {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                    {% set n = as_timestamp(now()) %}
                    {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                    {% set post = (bright_after_sunset | float(0)) * 3600 %}
                    {% set day = is_state(sun_entity, 'above_horizon') %}
                    {# daytime: bound both edges so negative offsets carve into daylight.
                       today's sunrise = r - 86400, today's sunset = s #}
                    {{ (day and (r is none or ((r - 86400) - n) <= pre)
                            and (s is none or (n - s) <= post))
                       or (not day and r is not none and (r - n) <= pre)
                       or (not day and s is not none and (n - (s - 86400)) <= post) }}
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_bright

            # master ON + dark -> dim scene
            default:
              - action: scene.turn_on
                target:
                  entity_id: !input scene_dim
