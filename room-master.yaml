blueprint:
  name: Room Master
  description: >
    A virtual "room" switch (an input_boolean) that is the single source of truth
    for a room, exposed to Apple Home / HomeKit while the real devices stay hidden.

    Two directions, one automation:
      - Physical devices (switches, buttons, motion) write INTO the master.
      - When the master changes externally, the matching scene is applied:
            master OFF            -> "Off" scene
            master ON + daylight  -> "Bright" scene
            master ON + dark      -> "Dim" scene

    Inputs come in three lists:
      - Normal inputs  -> Bright/Dim decided by the time-of-day window.
      - Force-Bright   -> always the Bright scene.
      - Force-Dim      -> always the Dim scene.

    If an entity ends up in more than one list, precedence is
    Force-Bright > Force-Dim > Normal.

    No mode helper is required.

  domain: automation
  author: Janis

  input:

    master:
      name: Room master
      description: >
        The input_boolean that represents this room (expose THIS to HomeKit).
      selector:
        entity:
          filter:
            domain: input_boolean

    sources:
      name: Physical input devices
      description: >
        Switches / buttons / motion sensors that drive the master, with the
        Bright/Dim scene chosen by the time-of-day window.
        Do NOT list the lights the scenes control here, or you'll create a loop.
      selector:
        entity:
          multiple: true

    bright_sources:
      name: Physical inputs — force Bright
      description: >
        Extra inputs that always apply the Bright scene, ignoring the
        day/night window.

        A press turns the room on in Bright.
        If the room is already on in Bright, the next press turns it off.
        If it is on in Dim, it upgrades to Bright.

        Force-Bright wins over Force-Dim and Normal.
      default: []
      selector:
        entity:
          multiple: true

    dim_sources:
      name: Physical inputs — force Dim
      description: >
        Extra inputs that always apply the Dim scene, ignoring the
        day/night window.

        A press turns the room on in Dim.
        If the room is already on in Dim, the next press turns it off.
        If it is on in Bright, it downgrades to Dim.

        Force-Dim wins over Normal, but loses to Force-Bright.
      default: []
      selector:
        entity:
          multiple: true

    map_mode:
      name: How inputs map to the master
      description: >
        Follow — any source ON turns the master ON; when ALL sources are OFF
        the master turns OFF.

        Toggle — every physical change flips the master.
        Best for bistable wall switches and momentary buttons.
      default: toggle
      selector:
        select:
          options:
            - label: "Toggle (every physical change flips master) — recommended"
              value: toggle
            - label: "Follow (any on / all off)"
              value: follow

    scene_off:
      name: "Off scene"
      selector:
        entity:
          filter:
            domain: scene

    scene_bright:
      name: "Bright scene (daylight)"
      selector:
        entity:
          filter:
            domain: scene

    scene_dim:
      name: "Dim scene (dark)"
      selector:
        entity:
          filter:
            domain: scene

    sun_entity:
      name: Sun entity
      description: Provides sunrise/sunset times for the Bright window.
      default: sun.sun
      selector:
        entity:
          filter:
            domain: sun

    bright_before_sunrise:
      name: Bright starts before sunrise
      description: >
        Hours to shift the start of "Bright" relative to sunrise.
        Positive = Bright begins before sunrise.
        Negative = Bright begins after sunrise.
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider

    bright_after_sunset:
      name: Bright ends after sunset
      description: >
        Hours to shift the end of "Bright" relative to sunset.
        Positive = Bright still applies after sunset.
        Negative = Bright ends before sunset.
      default: 0
      selector:
        number:
          min: -6
          max: 6
          step: 0.25
          unit_of_measurement: h
          mode: slider


mode: queued
max: 10
max_exceeded: silent


variables:
  master: !input master
  sources: !input sources
  bright_sources: !input bright_sources
  dim_sources: !input dim_sources
  map_mode: !input map_mode
  sun_entity: !input sun_entity
  bright_before_sunrise: !input bright_before_sunrise
  bright_after_sunset: !input bright_after_sunset


triggers:

  # ------------------------------------------------------------
  # Normal physical sources
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input sources
    id: source

  # ------------------------------------------------------------
  # Force-Bright sources
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input bright_sources
    id: bright_source

  # ------------------------------------------------------------
  # Force-Dim sources
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input dim_sources
    id: dim_source

  # ------------------------------------------------------------
  # Master changed
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input master
    id: master


conditions: []


actions:

  # ============================================================
  # FORCE-BRIGHT
  # ============================================================
  - choose:

      - conditions:
          - "{{ trigger.id == 'bright_source' }}"
          - "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"

          # Buttons/events are stateless.
          # For normal entities only accept an actual on/off change.
          - >
            {{
              trigger.entity_id.split('.')[0] in ['button', 'event']
              or (
                trigger.to_state.state in ['on', 'off']
                and trigger.from_state.state in ['on', 'off']
                and trigger.from_state.state != trigger.to_state.state
              )
            }}

        sequence:

          # ------------------------------------------------------
          # Already ON + already Bright
          # -> turn room OFF
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - "{{ is_state(master, 'on') }}"
                  - >
                    {{
                      trigger.entity_id not in dim_sources
                      or trigger.entity_id in bright_sources
                    }}

                sequence:

                  # We cannot know the previous forced mode anymore,
                  # so for a Force-Bright source we interpret a second
                  # press while ON as OFF.
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master

            default:

              # --------------------------------------------------
              # Turn room ON
              # --------------------------------------------------
              - action: input_boolean.turn_on
                target:
                  entity_id: !input master

              # --------------------------------------------------
              # Force Bright immediately
              # --------------------------------------------------
              - action: scene.turn_on
                target:
                  entity_id: !input scene_bright


  # ============================================================
  # FORCE-DIM
  # ============================================================
  - choose:

      - conditions:
          - "{{ trigger.id == 'dim_source' }}"
          - "{{ trigger.entity_id not in bright_sources }}"
          - "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"

          - >
            {{
              trigger.entity_id.split('.')[0] in ['button', 'event']
              or (
                trigger.to_state.state in ['on', 'off']
                and trigger.from_state.state in ['on', 'off']
                and trigger.from_state.state != trigger.to_state.state
              )
            }}

        sequence:

          # ------------------------------------------------------
          # Already ON
          # -> turn OFF
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - "{{ is_state(master, 'on') }}"

                sequence:

                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master

            default:

              # --------------------------------------------------
              # Turn room ON
              # --------------------------------------------------
              - action: input_boolean.turn_on
                target:
                  entity_id: !input master

              # --------------------------------------------------
              # Force Dim immediately
              # --------------------------------------------------
              - action: scene.turn_on
                target:
                  entity_id: !input scene_dim


  # ============================================================
  # NORMAL SOURCE
  # ============================================================
  - choose:

      - conditions:
          - "{{ trigger.id == 'source' }}"
          - "{{ trigger.entity_id not in bright_sources }}"
          - "{{ trigger.entity_id not in dim_sources }}"

        sequence:

          # ------------------------------------------------------
          # TOGGLE
          # ------------------------------------------------------
          - choose:

              # Momentary button / event
              - conditions:
                  - "{{ map_mode == 'toggle' }}"
                  - >
                    {{
                      trigger.entity_id.split('.')[0] in ['button', 'event']
                    }}
                  - "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"

                sequence:

                  - action: input_boolean.toggle
                    target:
                      entity_id: !input master

              # Normal bistable switch
              - conditions:
                  - "{{ map_mode == 'toggle' }}"
                  - "{{ trigger.to_state.state in ['on', 'off'] }}"
                  - "{{ trigger.from_state.state in ['on', 'off'] }}"
                  - "{{ trigger.from_state.state != trigger.to_state.state }}"

                sequence:

                  - action: input_boolean.toggle
                    target:
                      entity_id: !input master

              # ------------------------------------------------
              # FOLLOW
              # ------------------------------------------------
              - conditions:
                  - "{{ map_mode == 'follow' }}"
                  - "{{ trigger.to_state.state == 'on' }}"

                sequence:

                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input master

              - conditions:
                  - "{{ map_mode == 'follow' }}"
                  - >
                    {{
                      expand(sources)
                      | selectattr('state', 'eq', 'on')
                      | list
                      | count == 0
                    }}

                sequence:

                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input master


  # ============================================================
  # MASTER CHANGED EXTERNALLY
  #
  # IMPORTANT:
  # We only handle the master here when it was NOT turned on/off
  # by this automation itself.
  #
  # This prevents:
  #
  # source -> master -> master trigger -> wrong scene
  #
  # ============================================================
  - choose:

      - conditions:
          - "{{ trigger.id == 'master' }}"

          # Ignore changes initiated by another automation context.
          # Physical / HomeKit/manual changes have no parent context.
          - "{{ trigger.to_state.context.parent_id is none }}"

        sequence:

          # ------------------------------------------------------
          # MASTER OFF
          # ------------------------------------------------------
          - choose:

              - conditions:
                  - "{{ is_state(master, 'off') }}"

                sequence:

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_off


              # --------------------------------------------------
              # MASTER ON + BRIGHT WINDOW
              # --------------------------------------------------
              - conditions:
                  - >
                    {% set r = as_timestamp(state_attr(sun_entity, 'next_rising')) %}
                    {% set s = as_timestamp(state_attr(sun_entity, 'next_setting')) %}
                    {% set n = as_timestamp(now()) %}
                    {% set pre = (bright_before_sunrise | float(0)) * 3600 %}
                    {% set post = (bright_after_sunset | float(0)) * 3600 %}
                    {% set day = is_state(sun_entity, 'above_horizon') %}

                    {{
                      (
                        day
                        and (
                          r is none
                          or ((r - 86400) - n) <= pre
                        )
                        and (
                          s is none
                          or (n - s) <= post
                        )
                      )
                      or
                      (
                        not day
                        and r is not none
                        and (r - n) <= pre
                      )
                      or
                      (
                        not day
                        and s is not none
                        and (n - (s - 86400)) <= post
                      )
                    }}

                sequence:

                  - action: scene.turn_on
                    target:
                      entity_id: !input scene_bright


            # --------------------------------------------------
            # MASTER ON + DARK
            # --------------------------------------------------
            default:

              - action: scene.turn_on
                target:
                  entity_id: !input scene_dim