<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" font-family="Helvetica, Arial, sans-serif" role="img"><title>Valve head wiring</title><desc>Wiring between the 18650 holder, TP4056, ESP32-H2 Super Mini, DRV8833 board and N20 motor.</desc><rect width="1100" height="840" fill="#ffffff"/><text x="550" y="30" font-size="20" fill="#222" text-anchor="middle" font-weight="600" dominant-baseline="central">DIY valve head: wiring</text><text x="550" y="54" font-size="13" fill="#555" text-anchor="middle" font-weight="400" dominant-baseline="central">ESP32-H2 Super Mini, DRV8833 board, TP4056 with protection, one 18650. Drawn as a wiring plan, not in the housing's layout.</text><rect x="40" y="235" width="100" height="100" rx="6" fill="#b9bcc2" stroke="#666"/><text x="90" y="275" font-size="13" fill="#222" text-anchor="middle" font-weight="600" dominant-baseline="central">N20 motor</text><text x="90" y="295" font-size="11" fill="#333" text-anchor="middle" font-weight="400" dominant-baseline="central">swap wires if it</text><text x="90" y="309" font-size="11" fill="#333" text-anchor="middle" font-weight="400" dominant-baseline="central">runs backwards</text><rect x="230" y="120" width="150" height="312" rx="6" fill="#c8301f" stroke="none"/><text x="305" y="88" font-size="14" fill="#222" text-anchor="middle" font-weight="600" dominant-baseline="central">DRV8833 board</text><text x="305" y="106" font-size="12" fill="#333" text-anchor="middle" font-weight="400" dominant-baseline="central">seen from its label side (underside)</text><circle cx="245" cy="150" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="257" y="150" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">GND</text><circle cx="245" cy="186" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="257" y="186" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">BO1</text><circle cx="245" cy="222" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="257" y="222" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">BO2</text><circle cx="245" cy="258" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="257" y="258" font-size="12" fill="#fff" text-anchor="start" font-weight="600" dominant-baseline="central">AO2</text><circle cx="245" cy="294" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="257" y="294" font-size="12" fill="#fff" text-anchor="start" font-weight="600" dominant-baseline="central">AO1</text><circle cx="245" cy="330" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="257" y="330" font-size="12" fill="#fff" text-anchor="start" font-weight="600" dominant-baseline="central">GND</text><circle cx="245" cy="366" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="257" y="366" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">NC</text><circle cx="245" cy="402" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="257" y="402" font-size="12" fill="#fff" text-anchor="start" font-weight="600" dominant-baseline="central">VM</text><circle cx="365" cy="150" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="353" y="150" font-size="12" fill="#fff" text-anchor="end" font-weight="400" dominant-baseline="central">GND</text><circle cx="365" cy="186" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="353" y="186" font-size="12" fill="#fff" text-anchor="end" font-weight="400" dominant-baseline="central">NC</text><circle cx="365" cy="222" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="353" y="222" font-size="12" fill="#fff" text-anchor="end" font-weight="400" dominant-baseline="central">BIN2</text><circle cx="365" cy="258" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="353" y="258" font-size="12" fill="#fff" text-anchor="end" font-weight="400" dominant-baseline="central">BIN1</text><circle cx="365" cy="294" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="353" y="294" font-size="12" fill="#fff" text-anchor="end" font-weight="600" dominant-baseline="central">STBY</text><circle cx="365" cy="330" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="353" y="330" font-size="12" fill="#fff" text-anchor="end" font-weight="600" dominant-baseline="central">AIN1</text><circle cx="365" cy="366" r="6.5" fill="#f2c230" stroke="#7a6a20" stroke-width="1"/><text x="353" y="366" font-size="12" fill="#fff" text-anchor="end" font-weight="600" dominant-baseline="central">AIN2</text><circle cx="365" cy="402" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="353" y="402" font-size="12" fill="#fff" text-anchor="end" font-weight="400" dominant-baseline="central">NC</text><rect x="520" y="90" width="170" height="360" rx="6" fill="#1f5fa8" stroke="none"/><rect x="575" y="68" width="60" height="62" rx="4" fill="#b9bcc2" stroke="#777"/><text x="605" y="99" font-size="11" fill="#222" text-anchor="middle" font-weight="400" dominant-baseline="central">USB-C</text><text x="605" y="306" font-size="14" fill="#fff" text-anchor="middle" font-weight="600" dominant-baseline="central">ESP32-H2</text><text x="605" y="324" font-size="14" fill="#fff" text-anchor="middle" font-weight="600" dominant-baseline="central">Super Mini</text><text x="605" y="344" font-size="11" fill="#fff" text-anchor="middle" font-weight="400" dominant-baseline="central">parts up</text><circle cx="535" cy="130" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="547" y="130" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">TX</text><circle cx="535" cy="166" r="6.5" fill="#c9c4b4" stroke="#7a6a20" stroke-width="1"/><text x="547" y="166" font-size="12" fill="#fff" text-anchor="start" font-weight="400" dominant-baseline="central">RX</text><circle cx="53