3"/><text x="640" y="756" font-size="13" fill="#222" text-anchor="start" font-weight="400" dominant-baseline="central">GPIO 4 to STBY (high = on)</text><line x1="600" y1="778" x2="630" y2="778" stroke="#8a3fc4" stroke-width="3"/><text x="640" y="778" font-size="13" fill="#222" text-anchor="start" font-weight="400" dominant-baseline="central">AO1 and AO2 to the motor</text><text x="40" y="815" font-size="13" fill="#555" text-anchor="start" font-weight="400" dominant-baseline="central">Dashed = wire runs under the board. Never connect the ESP to USB while the battery is connected. Check the pad names on your boards before powering up.</text></svg>
