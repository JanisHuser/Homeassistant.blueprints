dependencies:
  # WS2812 status LED of the ESP32-H2 board (main/led.c); the XIAO ESP32-C6 has none.
  espressif/led_strip:
    version: "~2.5.5"
    rules:
      - if: "target == esp32h2"
  # BOOT button, with the light-sleep wake-up handled the way Espressif's ICD example does it.
  espressif/button:
    version: "^4"
