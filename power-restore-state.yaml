blueprint:
  name: Restore Device State After Power Loss
  description: >
    Keeps a live snapshot of each selected device and re-applies it when the
    device comes back after losing power — but only once the device actually
    responds (transitions from unavailable/unknown back to a real state).

    How it works:
      * Whenever a device changes while it is available, its current state is
        snapshotted into a per-device scene (exact brightness / colour / etc.).
      * The reconnect transition itself is ignored, so a device powering back on
        at its own default does NOT overwrite the good snapshot.
      * When a device becomes available again, after a short settle delay its
        snapshot scene is applied, restoring the pre-outage state.

    SCOPE: this assumes Home Assistant stays running through the outage (e.g. the
    HA host is on a UPS, or only the devices lose power). Snapshots live in memory
    only, so a full power loss that also reboots the HA host will lose them — that
    case needs disk-persisted snapshots (ask if you need that variant).
  domain: automation
  author: Janis
  input:
    targets:
      name: Devices to protect
      description: >
        Entities whose state should be restored after they come back online.
        Lights, switches, fans, etc.
      selector:
        entity:
          multiple: true

    settle_delay:
      name: Settle delay
      description: >
        Seconds to wait after a device responds before restoring, giving it time
        to finish booting so the restore command isn't dropped.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: s
          mode: slider

mode: queued
max: 50
max_exceeded: silent

triggers:
  # Any change — used to keep the snapshot fresh (filtered in the action).
  - trigger: state
    entity_id: !input targets
    id: snap
  # Device responded: came back from unavailable/unknown to a real state.
  - trigger: state
    entity_id: !input targets
    from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: back

conditions: []

actions:
  - variables:
      scene_slug: "prestore_{{ trigger.entity_id | replace('.', '_') }}"
      scene_entity: "scene.prestore_{{ trigger.entity_id | replace('.', '_') }}"

  - choose:
      # --- Keep the snapshot up to date ---------------------------------
      # Only snapshot genuine available->available changes, so the reconnect
      # transition (unavailable -> default) never pollutes the snapshot.
      - conditions:
          - "{{ trigger.id == 'snap' }}"
          - "{{ trigger.to_state.state not in ['unavailable', 'unknown'] }}"
          - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ scene_slug }}"
              snapshot_entities:
                - "{{ trigger.entity_id }}"

      # --- Device came back: restore the snapshot -----------------------
      - conditions:
          - "{{ trigger.id == 'back' }}"
          # Only restore if we actually captured a snapshot earlier.
          - "{{ scene_entity in (states.scene | map(attribute='entity_id') | list) }}"
        sequence:
          - delay:
              seconds: !input settle_delay
          - action: scene.turn_on
            target:
              entity_id: "{{ scene_entity }}"
