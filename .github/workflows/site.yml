# Renders every part (STL + PNG) and publishes the project page to the gh-pages branch.
name: Project site

on:
  push:
    branches: [main]
    paths: ["home-automations/**", "homeassistant.blueprints/**", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  firmware:
    # The installer flashes the latest release of each project (firmware.yml), not a build of main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          for src in home-automations/*/firmware; do
            project=$(basename "$(dirname "$src")")
            tag=$(grep -m1 "^$project-v" <<<"$tags" || true)
            [ -n "$tag" ] || { echo "$project: no release yet"; continue; }
            echo "$project: $tag"
            mkdir -p "_firmware/$project"
            gh release download "$tag" --pattern "$project-*.bin" --output "_firmware/$project/firmware.bin"
            echo "${tag##*-v}" > "_firmware/$project/version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: _firmware
          if-no-files-found: ignore

  build:
    # The page still publishes without firmware; it then offers no installer.
    needs: firmware
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: openscad/openscad:dev
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-yaml xvfb xauth
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firmware
          path: _firmware
      - name: Render parts and build page
        env:
          SITE_SOURCE_BRANCH: ${{ github.ref_name }}
        run: xvfb-run -a python3 site/build.py --out _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
