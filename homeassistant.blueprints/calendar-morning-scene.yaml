blueprint:
  name: Calendar Morning Action
  description: >
    At a set time each morning, read today's events from a calendar and run
    whatever you configured if any of today's event names matches one from your
    list.

    Add as many event names as you like — the automation runs once if at least
    one of today's events matches any of them.

    Matching is exact but case-insensitive (leading/trailing spaces ignored).
    By default only events that START today count, so an all-day event from
    yesterday — whose end date is today's date — is ignored.

    What happens on a match is configured with the normal action editor, so you
    can activate a scene, set a device, run a script, set a helper to a value,
    or any combination of those.

    Uses calendar.get_events so it sees ALL of today's events (all-day and timed),
    not just whatever event happens to be active at the trigger time.
  domain: automation
  author: Janis
  input:
    calendar:
      name: Calendar
      description: The calendar to read today's events from.
      selector:
        entity:
          filter:
            domain: calendar

    run_time:
      name: Run time
      description: Time each morning to check the calendar.
      default: "07:00:00"
      selector:
        time: {}

    event_names:
      name: Event names
      description: >
        Event names to look for. Add as many as you need — one per row.
        Case and surrounding spaces are ignored.
      default: []
      selector:
        text:
          multiple: true

    match_mode:
      name: Match events that
      description: >
        "Start today" only counts events beginning today — this ignores an
        all-day event from yesterday, whose end date is today's date.
        "Overlap today" also counts multi-day events that began earlier and
        still run today.
      default: starts_today
      selector:
        select:
          options:
            - label: Start today
              value: starts_today
            - label: Overlap today
              value: overlaps_today

    run_actions:
      name: Actions
      description: What to run when today has a matching event.
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  cal_entity: !input calendar
  raw_names: !input event_names
  match_mode: !input match_mode
  # Accept both a list and a single string, then normalise for comparison.
  wanted: >
    {{ (raw_names if raw_names is iterable and raw_names is not string
        else [raw_names])
       | map('lower') | map('trim') | reject('equalto', '') | list }}

triggers:
  - trigger: time
    at: !input run_time

conditions: []

actions:
  # Pull all of today's events (00:00 -> 24:00 local).
  - action: calendar.get_events
    target:
      entity_id: !input calendar
    data:
      start_date_time: "{{ today_at('00:00') }}"
      end_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
    response_variable: cal

  # Keep the events that really belong to today, then normalise their names to
  # lower-case, trimmed strings. Dates are compared as plain ISO strings, so no
  # timezone maths can shift an event onto the wrong day. An all-day event has
  # an exclusive end date, hence the strict > for those.
  - variables:
      summaries: >
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set ns = namespace(out=[]) %}
        {% for e in (cal[cal_entity].events if cal_entity in cal else []) %}
          {% set starts = (e.start | string)[:10] %}
          {% set ends = e.end | string %}
          {% set timed = ':' in ends %}
          {% set keep = (starts == today) if match_mode == 'starts_today'
                        else (starts <= today
                              and (ends[:10] >= today if timed
                                   else ends[:10] > today)) %}
          {% if keep %}
            {% set ns.out = ns.out + [e.summary | string | lower | trim] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}

  # Stop unless one of today's events matches a configured name.
  - condition: template
    value_template: "{{ wanted | select('in', summaries) | list | count > 0 }}"

  - choose: []
    default: !input run_actions
